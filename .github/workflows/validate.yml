name: validate

# Fail CI when a skill's frontmatter is wrong, the plugin manifest has drifted from
# what is on disk, a fork is missing its upstream licence or modification notice, or
# a reference file is unreachable. All logic lives in scripts/, so the same commands
# run locally — a green local run means the same thing as a green CI run.

# Manual only **while this directory lives inside the Odin monorepo**.
#
# An automatic trigger here fires on GitHub's runners the moment a push lands, with no `gh`
# command involved — the exact gap Layer 1D of `.claude/hooks/odin-safety-guard.sh` closes, and
# it is scoped to `projects/*/.github/workflows/` precisely because Odin's own root workflows
# must keep triggering (they are branch-protection status checks). With `pull_request`/`push`
# declared here, that guard refuses **every `git add`/`commit`/`push` in the whole monorepo** —
# it is not a warning, and there is no opt-out short of editing the hook.
#
# Restore `pull_request:` and `push: branches: [main]` in the same change that publishes this
# directory as its own repository, where the guard does not apply and CONTRIBUTING-style status
# checks are the point. Until then the validator runs locally, which is Odin's convention anyway:
#
#     bash projects/Odin-Skills/scripts/tests/validate.test.sh
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove the validator's checks still fire
        run: bash scripts/tests/validate.test.sh

      - name: Validate skills, manifests, licensing and provenance
        run: bash scripts/validate-skills.sh

      # Drift against the Odin harness is only checkable from inside a harness
      # checkout. In a standalone clone there is nothing to compare to, so this
      # step reports that it skipped rather than passing silently — a check that
      # quietly no-ops reads exactly like a check that passed.
      - name: Check mirror drift against the Odin harness
        run: |
          if [ -d ../../.claude/skills ]; then
            bash scripts/sync-from-odin.sh --check
          else
            echo "SKIPPED: no Odin harness checkout at ../../ — drift not checkable here."
          fi
